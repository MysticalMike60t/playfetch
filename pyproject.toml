[project]
name = "playfetch"
version = "0.1.0"
description = "Final python group project and presentation for CSPC 118, 2026."
readme = "README.md"
authors = [
    { name = "MysticalMike60t", email = "121118774+MysticalMike60t@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "brotli>=1.2.0",
    "bs4>=0.0.2",
    "http-client>=0.1.22",
    "logging>=0.4.9.6",
    "lxml>=6.1.3",
    "rich>=15.0.0",
]

[project.scripts]
playfetch = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
