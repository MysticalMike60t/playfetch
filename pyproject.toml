[project]
name = "playfetch"
version = "2026.11.12.1"
description = "Final python group project and presentation for CSPC 118, 2026."
readme = "README.md"
authors = [
    { name = "MysticalMike60t", email = "121118774+MysticalMike60t@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "art>=6.5",
    "bs4>=0.0.2",
    "ddgs>=9.16.1",
    "playwright>=1.65.1",
    "questionary>=2.1.1",
    "requests>=2.34.2",
]

[project.scripts]
playfetch = "main:main"
test = "test:main"

[dependency-groups]
dev = ["pyinstaller"]

# [tool.uv.sources]
# playfetchlib = { path = "./playfetchlib" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
